<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday! 🎂</title>
<style>
:root{--bg:#2a1a4a;--ink:#fff1c9;--pink:#ff4f8b}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#ffe9a8;--ink:#2a1a4a}}
:root[data-theme="light"]{--bg:#ffe9a8;--ink:#2a1a4a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:block}
h1{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);margin:0;text-align:center;font-size:clamp(2rem,8vw,3.4rem);line-height:1.05;color:#fff;text-shadow:0 3px 0 var(--pink),0 0 18px rgba(0,0,0,.55);z-index:2;pointer-events:none}
.cover{position:fixed;inset:0;z-index:3;border:0;margin:0;background:var(--bg);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer}
.cover b{font-size:clamp(2.4rem,10vw,4rem);color:var(--pink);transform:rotate(-2deg)}
.cover span{font-size:5rem}
.cover i{font-style:normal;font-size:1.2rem}
.cover:focus-visible{outline:4px solid var(--pink);outline-offset:-8px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
</style></head><body>
<video id="v" playsinline preload="auto" src="grok-video-f012dcce-60ba-41ea-944b-1dc25f7043e9.mp4"></video>
<h1>Happy Birthday!</h1>
<button class="cover" id="c" aria-label="Tap to play"><b>Happy Birthday!</b><span>🎁</span><i>Tap to open. Warning: you might laugh 😂</i></button>
<canvas id="cv"></canvas>
<script>
const v=document.getElementById('v'),c=document.getElementById('c'),cv=document.getElementById('cv'),x=cv.getContext('2d');
let P=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function boom(){const k=["#ff4f8b","#ffd23f","#3ec6ff","#7bd88f","#b07cff"];
for(let i=0;i<150;i++)P.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*16,vy:Math.random()*-13-2,s:6+Math.random()*8,c:k[i%5],r:Math.random()*6});
if(!run){run=true;tick()}}
function tick(){x.clearRect(0,0,cv.width,cv.height);
P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
P=P.filter(p=>p.y<innerHeight+20);if(P.length)requestAnimationFrame(tick);else run=false}

/* birthday song, made by the browser (no file needed) */
const S=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],
[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,1],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
const BEAT=.42,SONG_LEN=S.reduce((a,n)=>a+n[1],0)*BEAT;
let ac;
function song(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let t=ac.currentTime+.05;
S.forEach(([f,b])=>{const o=ac.createOscillator(),g=ac.createGain(),d=b*BEAT;o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(ac.destination);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d-.02);o.start(t);o.stop(t+d);t+=d})}

/* video plays, then pauses, the song plays, then the video continues */
c.onclick=()=>{c.remove();ac=ac||new(window.AudioContext||window.webkitAudioContext)();v.play();boom();setInterval(boom,3000)};
v.onended=()=>{v.pause();boom();song();setTimeout(()=>{v.currentTime=0;v.play()},SONG_LEN*1000+600)};
</script></body></html>
